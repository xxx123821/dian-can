<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>点餐商家后台</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#222;background:#f5f6f8;--line:#e1e4e8;--muted:#70757d;--accent:#1769d2;--danger:#b42318}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:0 auto;padding:20px 14px 40px}header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}h1{font-size:25px;margin:0 0 5px}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:18px 0 9px}.muted,.status{color:var(--muted);font-size:12px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:17px;margin-top:14px;box-shadow:0 1px 2px #00000008}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid-3{display:grid;grid-template-columns:1.2fr .7fr .7fr;gap:8px}.field{display:block;font-size:12px;color:#555}.field input,.field select{width:100%;min-height:38px;border:1px solid #ccd1d8;border-radius:6px;padding:7px 9px;margin-top:5px;font:inherit;background:#fff}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.item{border-top:1px solid #edf0f2;padding:10px 0}.item:first-child{border-top:0}.item .grid-3{align-items:end}.checkbox{display:flex;gap:5px;align-items:center;font-size:12px;color:#555}.checkbox input{width:17px;height:17px}.btn{border:1px solid #c8cdd4;background:#fff;border-radius:6px;padding:9px 13px;cursor:pointer;font:inherit}.btn.primary{color:#fff;background:var(--accent);border-color:var(--accent)}.btn.danger{color:var(--danger)}.btn:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:7px}table{width:100%;border-collapse:collapse;min-width:760px;font-size:12px}th,td{text-align:left;padding:9px;border-bottom:1px solid #edf0f2;white-space:nowrap}th{background:#fafbfc;font-weight:600}.empty{padding:18px;text-align:center;color:var(--muted);font-size:13px}.notice{padding:10px 12px;border-radius:6px;margin:10px 0;font-size:13px;display:none}.notice.show{display:block}.notice.error{background:#fff0f0;color:var(--danger)}.notice.ok{background:#effaf2;color:#20743d}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#f7f9fc;border:1px solid #e8edf4;border-radius:7px;padding:11px}.stat b{display:block;font-size:20px;margin-top:4px}@media(max-width:650px){.grid,.grid-3{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}header{display:block}.actions{margin-top:10px}}
  </style>
</head>
<body><main class="wrap">
  <header><div><h1>点餐商家后台</h1><div class="muted">菜单保存后，顾客下次刷新页面即可看到最新内容；订单每 10 秒刷新。</div></div><div class="actions"><button class="btn" id="refreshBtn">刷新订单</button><button class="btn primary" id="saveBtn">保存菜单</button></div></header>
  <div id="notice" class="notice"></div>
  <section class="card"><h2>套餐</h2><div id="packages"></div></section>
  <section class="card"><div class="row" style="justify-content:space-between"><h2 style="margin-bottom:0">菜品</h2><button class="btn" id="addDishBtn">新增菜品</button></div><div class="muted" style="margin:8px 0">关闭“上架”后，顾客页面不会显示该菜品。</div><div id="dishes"></div></section>
  <section class="card"><h2>商家信息与赠送内容</h2><div class="grid"><label class="field">联系人姓名<input id="contactName"></label><label class="field">联系人电话<input id="contactPhone"></label><label class="field">赠送汤品<input id="soupNotice" placeholder="例如：赠送汤品：紫菜蛋花汤"></label><label class="field">赠送菜品<input id="giftDish" placeholder="例如：赠送菜品：凉拌黄瓜"></label></div><h3>点餐时间（北京时间）</h3><div class="grid"><label class="field">午餐开始<input id="lunchStart" type="time"></label><label class="field">午餐结束<input id="lunchEnd" type="time"></label><label class="field">晚餐开始<input id="dinnerStart" type="time"></label><label class="field">晚餐结束<input id="dinnerEnd" type="time"></label></div></section>
  <section class="card"><div class="row" style="justify-content:space-between"><h2 style="margin-bottom:0">今日订单 <span class="muted" id="liveDate"></span></h2><span class="status" id="lastRefresh"></span></div><div class="stats" id="summary"></div><h3>订单明细</h3><div class="table-wrap"><table><thead><tr><th>序号</th><th>订单号</th><th>联系人</th><th>电话</th><th>时段</th><th>套餐</th><th>价格</th><th>主荤</th><th>副荤</th></tr></thead><tbody id="orders"></tbody></table></div><h3>菜品制作汇总</h3><div class="table-wrap"><table><thead><tr><th>分组</th><th>菜名</th><th>份数</th></tr></thead><tbody id="stats"></tbody></table></div></section>
</main><script>
const state={menu:null,dirty:false};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(message,error=false){const el=$('notice');el.textContent=message;el.className=`notice show ${error?'error':'ok'}`;clearTimeout(notice.timer);notice.timer=setTimeout(()=>el.classList.remove('show'),5000)}
function setting(key){return state.menu?.settings?.[key]?.value||''}function markDirty(){state.dirty=true;$('saveBtn').textContent='保存菜单*'}
function renderPackages(){const list=state.menu?.packages||[];$('packages').innerHTML=list.length?list.map((p,i)=>`<div class="item" data-package="${i}"><div class="grid-3"><label class="field">套餐键<input data-k="key" value="${esc(p.key)}" readonly></label><label class="field">套餐名称<input data-k="name" value="${esc(p.name)}"></label><label class="field">价格<input data-k="price" type="number" min="0" step="0.01" value="${Number(p.price)||0}"></label><label class="field">主荤数量<input data-k="mainCount" type="number" min="0" step="1" value="${Number(p.mainCount)||0}"></label><label class="field">副荤数量<input data-k="sideCount" type="number" min="0" step="1" value="${Number(p.sideCount)||0}"></label><label class="checkbox"><input data-k="enabled" type="checkbox" ${p.enabled?'checked':''}>启用</label><label class="checkbox"><input data-k="published" type="checkbox" ${p.published?'checked':''}>上架</label></div></div>`).join(''):'<div class="empty">暂无套餐</div>';document.querySelectorAll('#packages input').forEach(e=>e.addEventListener('input',markDirty));document.querySelectorAll('#packages input[type=checkbox]').forEach(e=>e.addEventListener('change',markDirty))}
function renderDishes(){const list=state.menu?.dishes||[];$('dishes').innerHTML=list.map((d,i)=>`<div class="item" data-dish="${i}"><div class="grid-3"><label class="field">菜名<input data-k="name" value="${esc(d.name)}"></label><label class="field">分组<select data-k="group"><option value="主荤" ${d.group==='主荤'||d.group==='主肉'||d.group==='mainMeat'?'selected':''}>主荤</option><option value="副荤" ${d.group==='副荤'||d.group==='半荤'||d.group==='sideMeat'?'selected':''}>副荤</option></select></label><label class="field">排序<input data-k="sort" type="number" value="${Number(d.sort)||0}"></label><label class="checkbox"><input data-k="enabled" type="checkbox" ${d.enabled?'checked':''}>启用</label><label class="checkbox"><input data-k="published" type="checkbox" ${d.published?'checked':''}>上架</label><button class="btn danger remove-dish" type="button">停用此菜</button></div></div>`).join('')||'<div class="empty">暂无菜品</div>';document.querySelectorAll('#dishes input,.remove-dish,#dishes select').forEach(e=>e.addEventListener('input',markDirty));document.querySelectorAll('#dishes input[type=checkbox]').forEach(e=>e.addEventListener('change',markDirty));document.querySelectorAll('.remove-dish').forEach((b,i)=>b.addEventListener('click',()=>{const d=state.menu.dishes[i];d.enabled=false;d.published=false;renderDishes();markDirty()}))}
function renderSettings(){for(const key of ['contactName','contactPhone','soupNotice','giftDish','lunchStart','lunchEnd','dinnerStart','dinnerEnd'])$(key).value=setting(key);document.querySelectorAll('section.card:nth-of-type(3) input').forEach(e=>e.addEventListener('input',markDirty))}
function collect(){const packages=[...document.querySelectorAll('[data-package]')].map((el,i)=>{const p=state.menu.packages[i];const v=k=>el.querySelector(`[data-k="${k}"]`);return{...p,key:v('key').value,name:v('name').value,price:Number(v('price').value),mainCount:Number(v('mainCount').value),sideCount:Number(v('sideCount').value),enabled:v('enabled').checked,published:v('published').checked}});const dishes=[...document.querySelectorAll('[data-dish]')].map((el,i)=>{const d=state.menu.dishes[i];const v=k=>el.querySelector(`[data-k="${k}"]`);return{...d,name:v('name').value,group:v('group').value,sort:Number(v('sort').value),enabled:v('enabled').checked,published:v('published').checked}});const settings={};for(const key of ['contactName','contactPhone','soupNotice','giftDish','lunchStart','lunchEnd','dinnerStart','dinnerEnd'])settings[key]=$(key).value;return{packages,dishes,settings}}
async function api(url,options){const r=await fetch(url,{cache:'no-store',...options});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw Error(d.error||`请求失败（${r.status}）`);return d}
function renderLive(data){$('liveDate').textContent=data.date||'';$('lastRefresh').textContent=`最近刷新：${new Date().toLocaleTimeString()}`;const orders=data.orders||[];$('summary').innerHTML=`<div class="stat">订单数<b>${orders.length}</b></div><div class="stat">营业额<b>¥${orders.reduce((s,o)=>s+Number(o.price||0),0).toFixed(2)}</b></div><div class="stat">菜品种类<b>${(data.stats||[]).length}</b></div>`;$('orders').innerHTML=orders.length?orders.map(o=>`<tr><td>${esc(o.sequenceNo)}</td><td>${esc(o.orderNo)}</td><td>${esc(o.name)}</td><td>${esc(o.phone)}</td><td>${esc(o.mealPeriod)}</td><td>${esc(o.packageName)}</td><td>¥${esc(o.price)}</td><td>${esc(o.mainMeat)}</td><td>${esc(o.sideMeat)}</td></tr>`).join(''):'<tr><td colspan="9" class="empty">今天还没有订单</td></tr>';$('stats').innerHTML=(data.stats||[]).length?data.stats.map(s=>`<tr><td>${esc(s.group)}</td><td>${esc(s.dishName)}</td><td>${esc(s.quantity)}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">今天还没有菜品统计</td></tr>'}
async function load(){try{const data=await api('/api/admin');state.menu=data.menu;renderPackages();renderDishes();renderSettings();renderLive(data);state.dirty=false;$('saveBtn').textContent='保存菜单'}catch(e){notice(e.message,true)}}async function refreshLive(){try{renderLive(await api('/api/admin?section=live'))}catch(e){notice(e.message,true)}}
$('saveBtn').addEventListener('click',async()=>{try{$('saveBtn').disabled=true;const data=await api('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(collect())});state.menu=data.menu;state.dirty=false;renderPackages();renderDishes();renderSettings();$('saveBtn').textContent='保存菜单';notice('菜单已保存，顾客刷新页面即可看到最新内容')}catch(e){notice(e.message,true)}finally{$('saveBtn').disabled=false}});$('refreshBtn').addEventListener('click',refreshLive);$('addDishBtn').addEventListener('click',()=>{state.menu.dishes.push({id:'',key:`dish-${Date.now()}`,name:'',group:'主荤',sort:state.menu.dishes.length,enabled:true,published:true});renderDishes();markDirty()});window.addEventListener('beforeunload',e=>{if(state.dirty){e.preventDefault();e.returnValue=''}});load();setInterval(()=>{if(!state.dirty)refreshLive()},10000);
</script></body></html>
